[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vgui-py"
version = "1.0.0"
description = "GoldSrc-inspired VGUI framework for Python"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.setuptools]
packages = ["vgui_py"]